name: deploy
# Run by hand from the Actions tab. Needs the repo secret DEPLOYER_KEY (a fresh wallet with a little HSK).
on:
  workflow_dispatch:
    inputs:
      network:
        description: testnet or mainnet
        required: true
        default: testnet
        type: choice
        options: [testnet, mainnet]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test, deploy and verify TeamSplitFactory
        working-directory: contracts
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          forge install --no-git foundry-rs/forge-std@v1.9.4
          forge test
          if [ "${{ inputs.network }}" = mainnet ]; then RPC=https://mainnet.hsk.xyz; CHAIN=177; EXP=https://hashkey.blockscout.com; else RPC=https://testnet.hsk.xyz; CHAIN=133; EXP=https://testnet-explorer.hsk.xyz; fi
          forge create src/TeamSplit.sol:TeamSplitFactory --rpc-url $RPC --private-key "$DEPLOYER_KEY" --broadcast \
            --verify --verifier blockscout --verifier-url $EXP/api/ | tee deploy.log
          ADDR=$(grep -oE 'Deployed to: 0x[0-9a-fA-F]{40}' deploy.log | awk '{print $3}')
          TX=$(grep -oE 'Transaction hash: 0x[0-9a-fA-F]{64}' deploy.log | awk '{print $3}')
          echo "{\"chainId\":$CHAIN,\"factory\":\"$ADDR\",\"tx\":\"$TX\",\"explorer\":\"$EXP/address/$ADDR\"}" > ../deployments/${{ inputs.network }}.json
          cat ../deployments/${{ inputs.network }}.json
      - name: Save address
        run: |
          git config user.name "teamsplit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deployments
          git commit -m "Deployed TeamSplitFactory to HSK ${{ inputs.network }}" && git push
